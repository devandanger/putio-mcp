[project]
name = "putio-mcp"
version = "0.2.0"
description = "Personal MCP server for managing put.io transfers, files, and folders from Claude Desktop"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6.0,<2",
    "putio-py>=8.8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
putio-mcp = "putio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/putio_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
